version: '3.8'

services:
  # ==========================================
  # 1. HẠ TẦNG CƠ SỞ (INFRASTRUCTURE)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: datn_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: online_judge_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datn_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: datn_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: rootpassword
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped


  # ==========================================
  # 2. KHỐI ỨNG DỤNG (APPLICATIONS)
  # ==========================================
  backend:
    build: ./backend
    container_name: datn_backend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      # LƯU Ý: Chạy trong Docker network nên trỏ tới host là 'postgres' và port nội bộ 5432
      - DATABASE_URL=postgresql://root:rootpassword@postgres:5432/online_judge_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JUDGE_RUNNER_URL=http://judge-runner:4000
    depends_on:
      - postgres
      - redis
      - rabbitmq

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datn_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    command: npm run dev


  # ==========================================
  # 3. KHỐI CHẤM BÀI (JUDGE SANDBOX)
  # ==========================================
  judge-runner:
    build:
      context: ./judge-runner
      dockerfile: Dockerfile
    container_name: datn_judge_runner
    ports:
      - "4000:4000"
    volumes:
      - judge-tmp:/tmp/judge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp/judge:size=100m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  judge-tmp: