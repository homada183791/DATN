services:
  # ==========================================
  # 1. HẠ TẦNG CƠ SỞ (INFRASTRUCTURE)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: datn_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: online_judge_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datn_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: datn_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: rootpassword
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  # ==========================================
  # 2. KHỐI ỨNG DỤNG (APPLICATIONS)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: datn_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://root:rootpassword@postgres:5432/online_judge_db?schema=public
      - JUDGE_RUNNER_URL=http://judge-runner:4000
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://root:rootpassword@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-for-dev}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:3000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-dhuy2017@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-yuhc iyow bdhh bamf}
      - SMTP_FROM=${SMTP_FROM:-dhuy2017@gmail.com}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: datn_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # ==========================================
  # 3. KHỐI CHẤM BÀI (JUDGE SANDBOX)
  # ==========================================
  judge-runner:
    build:
      context: ./judge-runner
      dockerfile: Dockerfile
    container_name: datn_judge_runner
    ports:
      - "4000:4000"
    volumes:
      - ./judge-runner:/app:delegated
      - /app/node_modules
      # Mount Docker socket để judge-runner có thể tạo container con
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - PORT=4000
      - RABBITMQ_URL=amqp://root:rootpassword@rabbitmq:5672
      - WEBHOOK_URL=http://backend:3000/api/v1/webhook/judge
      - DOCKER_SOCKET=/var/run/docker.sock
    depends_on:
      - rabbitmq
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
